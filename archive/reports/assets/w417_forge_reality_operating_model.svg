<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FORGE Reality Operating Model</title>
  <desc id="desc">A board-ready view of FORGE as a realistic consultant cockpit: proven automation now, evidence-led confidence, and guided expansion for new lanes and NetSuite features.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121f"/>
      <stop offset="0.52" stop-color="#08283a"/>
      <stop offset="1" stop-color="#05111d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#edf5f8"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3043"/>
      <stop offset="1" stop-color="#092033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#00131f" flood-opacity=".30"/>
    </filter>
    <style>
      text { font-family: Inter, Arial, sans-serif; letter-spacing:0; }
      .eyebrow { fill:#8dd7e5; font-size:18px; font-weight:900; letter-spacing:1.2px; }
      .headline { fill:#ffffff; font-size:54px; font-weight:900; }
      .subhead { fill:#bdd4df; font-size:23px; font-weight:600; }
      .small { fill:#5d7284; font-size:17px; font-weight:700; }
      .label { fill:#5e7284; font-size:15px; font-weight:900; letter-spacing:.8px; }
      .cardTitle { fill:#102132; font-size:30px; font-weight:900; }
      .cardCopy { fill:#2f465d; font-size:20px; font-weight:650; }
      .darkTitle { fill:#ffffff; font-size:28px; font-weight:900; }
      .darkCopy { fill:#c0d8e2; font-size:18px; font-weight:650; }
      .goldText { fill:#f7c431; font-size:20px; font-weight:900; }
      .tealText { fill:#21c4d8; font-size:20px; font-weight:900; }
      .greenText { fill:#58c98d; font-size:20px; font-weight:900; }
      .warnText { fill:#f7c431; font-size:17px; font-weight:900; }
      .pillText { fill:#0c2d3b; font-size:17px; font-weight:900; }
      .whitePillText { fill:#ffffff; font-size:17px; font-weight:900; }
      .num { fill:#ffffff; font-size:22px; font-weight:900; text-anchor:middle; dominant-baseline:middle; }
      .line { stroke:#6faabd; stroke-width:4; stroke-linecap:round; }
      .dash { stroke:#f7c431; stroke-width:3; stroke-linecap:round; stroke-dasharray:8 9; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="44" y="38" width="1512" height="824" rx="34" fill="#071a2a" stroke="#1b5a70" stroke-width="3"/>

  <image href="../../../assets/forge-header-logo-cropped.png" x="84" y="72" width="300" height="80" preserveAspectRatio="xMinYMin meet"/>

  <text x="84" y="198" class="eyebrow">REALISTIC OPERATING MODEL</text>
  <text x="84" y="260" class="headline">Automate proven demo proof.</text>
  <text x="84" y="299" class="subhead">Use guided SC tuning where the lane, feature, or record path is still new.</text>

  <g transform="translate(1040 92)">
    <rect width="420" height="94" rx="22" fill="#092d40" stroke="#2b7890"/>
    <circle cx="46" cy="44" r="23" fill="#f7c431"/>
    <text x="46" y="51" fill="#061321" font-size="24" font-weight="900" text-anchor="middle">!</text>
    <text x="86" y="38" class="warnText">Honest boundary</text>
    <text x="86" y="63" class="darkCopy">Proven paths automate.</text>
    <text x="86" y="86" class="darkCopy">New scope is tuned.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="350" width="430" height="310" rx="24" fill="url(#card)" stroke="#bed5df"/>
    <circle cx="132" cy="406" r="30" fill="#0a7890"/>
    <text x="132" y="407" class="num">1</text>
    <text x="180" y="397" class="label">CONSULTANT STARTS</text>
    <text x="180" y="437" class="cardTitle">3 inputs + toggles</text>
    <rect x="118" y="477" width="340" height="42" rx="12" fill="#ffffff" stroke="#c8dbe3"/>
    <text x="140" y="504" class="cardCopy">Customer name</text>
    <rect x="118" y="532" width="340" height="42" rx="12" fill="#ffffff" stroke="#c8dbe3"/>
    <text x="140" y="559" class="cardCopy">Website</text>
    <rect x="118" y="587" width="340" height="42" rx="12" fill="#ffffff" stroke="#c8dbe3"/>
    <text x="140" y="614" class="cardCopy">Messy seller notes</text>
    <g transform="translate(118 646)">
      <rect width="92" height="36" rx="18" fill="#e5f6f0" stroke="#9ac9ad"/>
      <text x="46" y="24" class="pillText" text-anchor="middle">Item</text>
      <rect x="108" width="92" height="36" rx="18" fill="#eef5f8" stroke="#b7ced9"/>
      <text x="154" y="24" class="pillText" text-anchor="middle">MFG</text>
      <rect x="216" width="92" height="36" rx="18" fill="#eef5f8" stroke="#b7ced9"/>
      <text x="262" y="24" class="pillText" text-anchor="middle">WIP</text>
    </g>
  </g>

  <g>
    <line x1="532" y1="507" x2="616" y2="507" class="line"/>
    <polygon points="616,507 598,496 598,518" fill="#6faabd"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="632" y="350" width="430" height="310" rx="24" fill="url(#card)" stroke="#bed5df"/>
    <circle cx="680" cy="406" r="30" fill="#0a7890"/>
    <text x="680" y="407" class="num">2</text>
    <text x="728" y="397" class="label">FORGE CHOOSES SAFELY</text>
    <text x="728" y="437" class="cardTitle">Evidence-led story</text>
    <g transform="translate(674 482)">
      <rect width="336" height="44" rx="13" fill="#e8f7fa" stroke="#82c7d4"/>
      <text x="22" y="28" class="tealText">Website evidence</text>
      <text x="192" y="28" class="cardCopy">guides lane + names</text>
      <rect y="62" width="336" height="44" rx="13" fill="#eef8f1" stroke="#93cca9"/>
      <text x="22" y="90" class="greenText">Notes</text>
      <text x="90" y="90" class="cardCopy">shape ROI + objections</text>
      <rect y="124" width="336" height="44" rx="13" fill="#fff8df" stroke="#e5c351"/>
      <text x="22" y="152" class="goldText">LLM</text>
      <text x="78" y="152" class="cardCopy">advises only, never writes</text>
    </g>
  </g>

  <g>
    <line x1="1080" y1="507" x2="1164" y2="507" class="line"/>
    <polygon points="1164,507 1146,496 1146,518" fill="#6faabd"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1180" y="350" width="310" height="310" rx="24" fill="url(#card)" stroke="#bed5df"/>
    <circle cx="1228" cy="406" r="30" fill="#0a7890"/>
    <text x="1228" y="407" class="num">3</text>
    <text x="1276" y="397" class="label">POST-RUN REALITY</text>
    <text x="1276" y="437" class="cardTitle">One cockpit</text>
    <rect x="1218" y="480" width="236" height="46" rx="12" fill="#ffffff" stroke="#c8dbe3"/>
    <text x="1240" y="510" class="cardCopy">Open records</text>
    <rect x="1218" y="540" width="236" height="46" rx="12" fill="#ffffff" stroke="#c8dbe3"/>
    <text x="1240" y="570" class="cardCopy">Say the story</text>
    <rect x="1218" y="600" width="236" height="46" rx="12" fill="#ffffff" stroke="#c8dbe3"/>
    <text x="1240" y="630" class="cardCopy">ROI + objection</text>
    <rect x="1218" y="674" width="236" height="40" rx="20" fill="#0b3043" stroke="#2b7890"/>
    <text x="1336" y="700" class="whitePillText" text-anchor="middle">Support collapsed</text>
  </g>

  <g transform="translate(84 724)">
    <rect width="686" height="88" rx="20" fill="url(#darkCard)" stroke="#1f6277"/>
    <text x="32" y="36" class="darkTitle">Automate now</text>
    <text x="32" y="66" class="darkCopy">Inventory, SO/PO, reorder points, work orders, MFG, WIP/routing.</text>
  </g>

  <g transform="translate(804 724)">
    <rect width="686" height="88" rx="20" fill="url(#darkCard)" stroke="#725f1d"/>
    <text x="32" y="36" class="darkTitle">Expand deliberately</text>
    <text x="32" y="66" class="darkCopy">Fixture proof, source-pack review, targeted smoke only when risk changes.</text>
  </g>

  <g transform="translate(330 314)">
    <line x1="0" y1="0" x2="938" y2="0" class="dash"/>
  </g>
</svg>
