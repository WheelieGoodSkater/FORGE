<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">FORGE V2 Demo Cockpit</title>
  <desc id="desc">A simplified consultant workflow showing sales request entry, FORGE story and naming authority, and one post-run demo cockpit with collapsed support.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071421"/>
      <stop offset="1" stop-color="#0d3042"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#eef6f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00131f" flood-opacity=".28"/>
    </filter>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .title { fill:#fff; font-size:54px; font-weight:800; letter-spacing:0; }
      .subtitle { fill:#b8d1dd; font-size:24px; font-weight:600; }
      .panel-title { fill:#102132; font-size:28px; font-weight:800; }
      .small-title { fill:#536477; font-size:15px; font-weight:800; letter-spacing:.8px; }
      .body { fill:#213447; font-size:22px; font-weight:600; }
      .copy { fill:#37506a; font-size:18px; font-weight:500; }
      .muted { fill:#65778a; font-size:16px; font-weight:700; }
      .chip { fill:#0a7890; font-size:16px; font-weight:800; }
      .gold { fill:#f6c431; }
      .teal { fill:#00a0b5; }
      .green { fill:#31845a; }
      .line { stroke:#9fc2d0; stroke-width:3; }
      .num { fill:#fff; font-size:18px; font-weight:900; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>
  <rect width="1400" height="900" rx="34" fill="url(#bg)"/>
  <rect x="42" y="38" width="1316" height="824" rx="30" fill="#092034" stroke="#19566b" stroke-width="3"/>

  <g transform="translate(78 68)">
    <rect width="214" height="72" rx="13" fill="#061321" stroke="#6f93a5"/>
    <circle cx="39" cy="36" r="22" fill="#f6c431"/>
    <text x="73" y="38" fill="#fff" font-size="30" font-weight="900" dominant-baseline="middle">FORGE</text>
    <text x="74" y="59" fill="#f6c431" font-size="11" font-weight="800">SC DEMO CREATION TOOL</text>
  </g>
  <text x="78" y="195" class="title">V2: One Request. One Cockpit.</text>
  <text x="80" y="234" class="subtitle">LLM advises. Notes shape the story. Website evidence guides the lane. NetSuite proof verifies.</text>

  <g filter="url(#shadow)">
    <rect x="78" y="290" width="350" height="385" rx="22" fill="url(#panel)" stroke="#c0d6df"/>
    <text x="110" y="335" class="small-title">1. CONSULTANT ENTRY</text>
    <text x="110" y="382" class="panel-title">Sales request</text>
    <rect x="110" y="416" width="286" height="52" rx="12" fill="#fff" stroke="#c6d8df"/>
    <text x="130" y="449" class="copy">Customer name</text>
    <rect x="110" y="485" width="286" height="52" rx="12" fill="#fff" stroke="#c6d8df"/>
    <text x="130" y="518" class="copy">Website</text>
    <rect x="110" y="554" width="286" height="80" rx="12" fill="#fff" stroke="#c6d8df"/>
    <text x="130" y="587" class="copy">Messy sales notes</text>
    <g transform="translate(110 655)">
      <rect width="84" height="34" rx="17" fill="#e5f6f0" stroke="#94c9b1"/>
      <text x="42" y="22" class="green" text-anchor="middle" font-size="14" font-weight="800">Item</text>
      <rect x="96" width="84" height="34" rx="17" fill="#eef5f8" stroke="#b7ced9"/>
      <text x="138" y="22" fill="#52687a" text-anchor="middle" font-size="14" font-weight="800">MFG</text>
      <rect x="192" width="84" height="34" rx="17" fill="#eef5f8" stroke="#b7ced9"/>
      <text x="234" y="22" fill="#52687a" text-anchor="middle" font-size="14" font-weight="800">WIP</text>
    </g>
  </g>

  <g>
    <line x1="448" y1="482" x2="522" y2="482" class="line"/>
    <circle cx="485" cy="482" r="22" fill="#0b7d95"/>
    <text x="485" y="482" class="num">2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="522" y="290" width="350" height="385" rx="22" fill="url(#panel)" stroke="#c0d6df"/>
    <text x="554" y="335" class="small-title">2. FORGE DECIDES</text>
    <text x="554" y="382" class="panel-title">Story and proof path</text>
    <rect x="554" y="416" width="286" height="58" rx="12" fill="#e9f7fa" stroke="#81c5d3"/>
    <text x="574" y="450" class="body">Lane from evidence</text>
    <rect x="554" y="491" width="286" height="58" rx="12" fill="#fff8df" stroke="#e7c450"/>
    <text x="574" y="525" class="body">Names from website + advisory</text>
    <rect x="554" y="566" width="286" height="58" rx="12" fill="#edf7ef" stroke="#95c7a5"/>
    <text x="574" y="600" class="body">ROI and objections from notes</text>
    <text x="554" y="668" class="muted">Guardrail: N/LLM cannot write, create,</text>
    <text x="554" y="691" class="muted">change toggles, or hide uncertainty.</text>
  </g>

  <g>
    <line x1="892" y1="482" x2="966" y2="482" class="line"/>
    <circle cx="929" cy="482" r="22" fill="#0b7d95"/>
    <text x="929" y="482" class="num">3</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="966" y="248" width="354" height="512" rx="22" fill="url(#panel)" stroke="#c0d6df"/>
    <text x="998" y="293" class="small-title">3. DEMO COCKPIT</text>
    <text x="998" y="338" class="panel-title">Herr Foods</text>
    <text x="998" y="368" class="copy">Finished-good promotion readiness</text>
    <rect x="998" y="400" width="290" height="42" rx="10" fill="#fff" stroke="#b7d1dc"/>
    <text x="1016" y="427" fill="#102132" font-size="17" font-weight="800">Customer: Herr Foods</text>
    <text x="1260" y="427" class="chip" text-anchor="end">Open</text>
    <rect x="998" y="454" width="290" height="42" rx="10" fill="#fff" stroke="#b7d1dc"/>
    <text x="1016" y="481" fill="#102132" font-size="17" font-weight="800">Order: SO2712</text>
    <text x="1260" y="481" class="chip" text-anchor="end">Open</text>
    <rect x="998" y="508" width="290" height="42" rx="10" fill="#fff" stroke="#b7d1dc"/>
    <text x="1016" y="535" fill="#102132" font-size="17" font-weight="800">Item: Snack Variety Pack</text>
    <text x="1260" y="535" class="chip" text-anchor="end">Open</text>
    <rect x="998" y="580" width="132" height="94" rx="12" fill="#fff" stroke="#8fc2a1"/>
    <text x="1014" y="608" class="small-title">TOP ROI</text>
    <text x="1014" y="638" fill="#102132" font-size="17" font-weight="800">Protect promo</text>
    <text x="1014" y="661" fill="#102132" font-size="17" font-weight="800">promise</text>
    <rect x="1148" y="580" width="140" height="94" rx="12" fill="#fff" stroke="#d6bd63"/>
    <text x="1164" y="608" class="small-title">HANDLE</text>
    <text x="1164" y="638" fill="#102132" font-size="17" font-weight="800">Is inventory</text>
    <text x="1164" y="661" fill="#102132" font-size="17" font-weight="800">current?</text>
    <rect x="998" y="697" width="290" height="36" rx="18" fill="#e8f1f5" stroke="#bfd2dc"/>
    <text x="1143" y="720" fill="#37506a" font-size="15" font-weight="800" text-anchor="middle">Support / troubleshoot collapsed</text>
  </g>

  <g transform="translate(78 790)">
    <rect width="1242" height="42" rx="21" fill="#061b2c" stroke="#19566b"/>
    <text x="26" y="27" fill="#8bd8e7" font-size="16" font-weight="800">Default outcome:</text>
    <text x="170" y="27" fill="#fff" font-size="16" font-weight="700">consultant enters notes, runs FORGE, opens verified NetSuite records, lands value and objection handling from one screen.</text>
  </g>
</svg>
